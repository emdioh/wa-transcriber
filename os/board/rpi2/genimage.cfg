# SD card layout for the Raspberry Pi 2.
#   p1 boot: FAT, firmware + kernel + dtb + config.txt + cmdline.txt + wat.txt
#   p2 root A: ext4 (label wat-root-a), read-only, the running system
#   p3 root B: ext4 (label wat-root-b), read-only, written by an image update
#   p4 data: created on first boot by /etc/init.d/S01data
#
# Two root slots (D18): an image update writes the inactive one and never the
# slot that is running. The boot files name the slot by device path
# (root=/dev/mmcblk0p2 in cmdline.txt), so SD and eMMC behave the same.
# p3 carries no useful data in the card image: it is a ready-to-use ext4 that
# the update overwrites.
#
# The p3 filesystem is made by mkimage.sh (genimage would fail on a missing
# input file and cannot size a second empty one here).
#
# Called from os/Makefile with genimage --inputpath images --outputpath images.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"cmdline.txt",
			"config.txt",
			"zImage",
			"bcm2709-rpi-2-b.dtb",
			"wat.txt"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 160M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs-b.ext4"
		size = 160M
	}

	# p4 (DATA) is created on the device at first boot; the rest of the card
	# is left unpartitioned on purpose.
}
