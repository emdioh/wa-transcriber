# SD card layout for the Raspberry Pi 2.
#   p1 boot: FAT, firmware + kernel + dtb + config.txt + cmdline.txt + wat.txt
#   p2 root: ext4, read-only
#   p3 data: created on first boot by /etc/init.d/S01data
#
# Called from os/Makefile with genimage --inputpath images --outputpath images.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"bootcode.bin",
			"start.elf",
			"fixup.dat",
			"cmdline.txt",
			"config.txt",
			"zImage",
			"bcm2709-rpi-2-b.dtb",
			"wat.txt"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 160M
	}

	# p3 (DATA) is created on the device at first boot; the rest of the card
	# is left unpartitioned on purpose.
}
