# SD card layout for the Cubieboard 1 (Allwinner A10 / sun4i).
#   raw 8K:   u-boot-sunxi-with-spl.bin (not in the MBR partition table; loaded by BROM at sector 16)
#   p1 boot:  FAT (offset 1M), zImage + sun4i-a10-cubieboard.dtb + extlinux + wat.txt
#   p2 root A: ext4 (label wat-root-a), read-only, the running system
#   p3 root B: ext4 (label wat-root-b), read-only, written by an image update
#   p4 data:  created on first boot by /etc/init.d/S01data (or internal/boot)
#
# Two root slots (D18): an image update writes the inactive one and never the
# slot that is running. The boot files name the slot by device path
# (root=/dev/mmcblk0p2 in extlinux.conf). p3 carries no useful data in the card
# image: it is a ready-to-use ext4 that the update overwrites.
#
# The p3 filesystem is made by mkimage.sh (genimage would fail on a missing
# input file and cannot size a second empty one here).
#
# Called from os/Makefile with genimage --inputpath images --outputpath images.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"zImage",
			"sun4i-a10-cubieboard.dtb",
			"wat.txt",
			"extlinux"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	# Allwinner A10 BROM loads the U-Boot SPL from offset 8 KiB (sector 16),
	# before the first MBR partition at 1 MiB.
	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 1016K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 160M
	}

	partition rootfs-b {
		partition-type = 0x83
		image = "rootfs-b.ext4"
		size = 160M
	}

	# p4 (DATA) is created on the device at first boot; the rest of the card
	# is left unpartitioned on purpose.
}
