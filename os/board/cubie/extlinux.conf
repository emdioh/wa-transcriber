label wa-transcriber
    kernel /zImage
    devicetree /sun4i-a10-cubieboard.dtb
    append root=/dev/mmcblk0p2 rootfstype=ext4 ro rootwait earlycon=uart,mmio32,0x01c28000 console=ttyS0,115200 console=tty1 init=/usr/bin/wa-transcriber
    # root= names the boot slot by device path: p2 (root A) for the first
    # boot, p3 or p2 after an image update. The running system finds the
    # other slot from its own block device (D18), so no UUID has to be kept
    # in step with what the update writes.
    #
    # init= makes the transcriber the machine's init instead of busybox
    # (D19): the kernel execs it directly, so /etc/inittab and the
    # /etc/init.d scripts never run and the program mounts /proc, /sys, /boot
    # and /data, loads the watchdog module and reaps its own children. Its
    # settings are the defaults in cmd/wa-transcriber/initmode.go, which this
    # line can override: add wat.network=none and the program runs without the
    # network manager, wat.listen=:8080 and it listens elsewhere.
    #
    # Rollback, no reflash: mount the boot partition on any machine and delete
    # the init= token. Without it the kernel starts busybox init again and the
    # old S00boot/S01data/rcS path runs, exactly as before D19.
