label wa-transcriber
    kernel /zImage
    devicetree /am335x-boneblack.dtb
    append root=/dev/mmcblk0p2 rootfstype=ext4 ro rootwait earlycon=uart8250,mmio32,0x44e09000,115200n8 console=ttyS0,115200 console=tty1
    # root= names the boot slot by device path: p2 (root A) for the first
    # boot, p3 or p2 after an image update. The running system finds the
    # other slot from its own block device (D18), so SD and eMMC behave the
    # same and no UUID has to be kept in step with what the update writes.
