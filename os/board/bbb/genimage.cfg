# SD card layout for the BeagleBone Black.
#   p1 boot: FAT, MLO + u-boot.img + zImage + dtb + extlinux + wat.txt
#   p2 root: ext4, read-only
#   p3 data: created on first boot by /etc/init.d/S01data
#
# Called from os/Makefile with genimage --inputpath images --outputpath images.

image boot.vfat {
	vfat {
		label = "boot"
		files = {
			"MLO",
			"u-boot.img",
			"zImage",
			"am335x-boneblack.dtb",
			"wat.txt",
			"extlinux"
		}
	}
	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 160M
	}
}
