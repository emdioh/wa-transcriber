<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · WA Transcriber</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">🎤 WA Transcriber</a>
  {{if .LoggedIn}}
  <nav>
    <a href="/" {{if eq .Nav "status"}}aria-current="page"{{end}}>Status</a>
    <a href="/whatsapp" {{if eq .Nav "whatsapp"}}aria-current="page"{{end}}>WhatsApp</a>
    <a href="/transcription" {{if eq .Nav "transcription"}}aria-current="page"{{end}}>Transcription</a>
    <a href="/network" {{if eq .Nav "network"}}aria-current="page"{{end}}>Network</a>
    <a href="/logs" {{if eq .Nav "logs"}}aria-current="page"{{end}}>Logs</a>
    <a href="/system" {{if eq .Nav "system"}}aria-current="page"{{end}}>System</a>
  </nav>
  <form method="post" action="/logout" class="logout"><button class="link">Log out</button></form>
  {{end}}
</header>
<main>
  <h1>{{.Title}}</h1>
  {{with .Flash}}<p class="flash {{if .OK}}ok{{else}}err{{end}}" role="status">{{.Text}}</p>{{end}}
  {{template "content" .Page}}
</main>
<footer>wa-transcriber {{.Version}}</footer>
</body>
</html>
