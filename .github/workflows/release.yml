name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: Binaries and checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git describe needs the tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make dist VERSION="${GITHUB_REF_NAME}"

      - name: Checksums
        run: cd dist && sha256sum wa-transcriber-linux-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/wa-transcriber-linux-*
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    name: Multi-arch container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Manifest and compressed sizes
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "$ref" --raw > index.json
          jq -r '.manifests[]
                 | select(.platform.architecture != "unknown")
                 | "\(.platform.os)/\(.platform.architecture)/\(.platform.variant // "") \(.digest)"' index.json |
          while read -r platform digest; do
            bytes=$(docker buildx imagetools inspect "$ref@$digest" --raw | jq '[.layers[].size] | add')
            awk -v p="$platform" -v b="$bytes" 'BEGIN { printf "%s %.1f MB compressed\n", p, b/1000000 }'
          done
